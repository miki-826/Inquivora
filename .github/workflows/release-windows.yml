name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  checks: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks
        run: |
          npm run lint
          npm run typecheck
          npm test
          node scripts/audit-check.mjs

      - name: Frontend production build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Native sidecar tests
        run: dotnet test native/Inquivora.Native.sln --configuration Release

      - name: Publish native sidecar
        run: node scripts/build-sidecar.mjs

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Inquivora ${{ github.ref_name }}'
          releaseBody: |
            ビルド元コミット: ${{ github.sha }}
            各ファイルのSHA-256はSHA256SUMS.txtを参照してください。
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: false

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $lines = foreach ($f in $files) {
            "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f.Name
          }
          $lines | Out-File SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Attach SHA256SUMS.txt to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} SHA256SUMS.txt --clobber

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Inquivora-Windows-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish release after all artifacts succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false --prerelease
