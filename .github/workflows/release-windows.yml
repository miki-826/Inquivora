name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Sidecar実装後（Phase 4以降）に有効化する
      # - name: Setup .NET
      #   uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: '8.0.x'
      # - name: Native sidecar tests
      #   run: dotnet test native/Inquivora.Native/Inquivora.Native.sln --configuration Release
      # - name: Publish native sidecar
      #   run: dotnet publish native/Inquivora.Native/Inquivora.Native.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Inquivora ${{ github.ref_name }}'
          releaseBody: |
            ビルド元コミット: ${{ github.sha }}
            各ファイルのSHA-256はSHA256SUMS.txtを参照してください。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $lines = foreach ($f in $files) {
            "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f.Name
          }
          $lines | Out-File SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Attach SHA256SUMS.txt to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} SHA256SUMS.txt --clobber

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Inquivora-Windows-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
